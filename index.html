<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rifa da Mesa de Sinuca</title>
<meta name="description" content="Concorra a uma mesa de sinuca ou R$ 2.000 no Pix. 1000 números a R$ 5 cada, sorteio pela Loteria Federal.">

<!-- Prévia no WhatsApp / redes sociais -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rifa da Mesa de Sinuca">
<meta property="og:title" content="Rifa da Mesa de Sinuca · R$ 5 o número">
<meta property="og:description" content="Mesa de sinuca ou R$ 2.000 no Pix, você escolhe. 1000 números a R$ 5 cada, sorteio pela Loteria Federal.">
<meta property="og:url" content="https://caique4ndrade.github.io/RifaSinuca/">
<meta property="og:image" content="https://caique4ndrade.github.io/RifaSinuca/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://caique4ndrade.github.io/RifaSinuca/og.jpg">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17191d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="app"><p class="loading">Carregando a rifa…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script>
const MAX_POR_RESERVA = 50;
const SITE = 'https://caique4ndrade.github.io/RifaSinuca/';
const app = document.getElementById('app');
let ranking = [];
let C = null, ocupados = new Map(), sel = new Set(), faixa = 0;
let regrasAbertas = false;
let nome = '', fone = '', busca = '', erro = '', dica = '', reservado = null, reservadoEm = null, enviando = false;

async function carregar() {
  const [c, n, r] = await Promise.all([
    sb.from('rifa_config').select('*').eq('id', 1).single(),
    sb.rpc('rifa_status'),
    sb.rpc('rifa_ranking', { p_limite: 5 })
  ]);
  if (c.error || n.error) {
    app.replaceChildren(h('p', { class: 'loading' }, 'Não foi possível carregar a rifa. Verifique sua internet e atualize a página.'));
    return;
  }
  C = c.data;
  ocupados = new Map(n.data.map(x => [x.numero, x.status]));
  ranking = (r && !r.error && r.data) || []; // sem a função no banco, só não mostra
  ocupados.forEach((_, k) => sel.delete(k)); // alguém pegou antes
  render();
}

const status = n => ocupados.get(n) || 'livre';

function escolher(n) {
  if (sel.has(n)) { sel.delete(n); return true; }
  if (sel.size >= MAX_POR_RESERVA) { dica = 'Máximo de ' + MAX_POR_RESERVA + ' números por reserva.'; return false; }
  sel.add(n); return true;
}

function livresDisponiveis() {
  const l = [];
  for (let n = PRIMEIRO; n <= ultimo(C.total); n++) if (status(n) === 'livre' && !sel.has(n)) l.push(n);
  return l;
}

function compraRapida(qtd) {
  dica = '';
  const livres = livresDisponiveis();
  const cabe = Math.min(qtd, MAX_POR_RESERVA - sel.size, livres.length);
  if (cabe <= 0) { dica = livres.length ? 'Máximo de ' + MAX_POR_RESERVA + ' números por reserva.' : 'Não há mais números livres.'; return render(); }
  const r = new Uint32Array(cabe); crypto.getRandomValues(r);
  let ultimoEscolhido = null;
  for (let i = 0; i < cabe; i++) {
    const j = r[i] % livres.length;
    ultimoEscolhido = livres[j]; sel.add(livres[j]);
    livres.splice(j, 1);
  }
  if (cabe < qtd) dica = 'Foram adicionados ' + cabe + ' números (limite de ' + MAX_POR_RESERVA + ' por reserva).';
  faixa = faixaDe(ultimoEscolhido); reservado = null; render();
  document.getElementById('painel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function irPara() {
  const n = parseInt(busca, 10);
  dica = '';
  if (isNaN(n) || n < PRIMEIRO || n > ultimo(C.total)) { dica = 'Digite um número de ' + pad(PRIMEIRO) + ' a ' + pad(ultimo(C.total)) + '.'; return render(); }
  faixa = faixaDe(n);
  if (status(n) !== 'livre') dica = 'O número ' + pad(n) + ' já foi ' + (status(n) === 'pago' ? 'vendido' : 'reservado') + '.';
  else if (!sel.has(n)) escolher(n);
  reservado = null; render();
}

function mensagem(nums) {
  return 'Olá! Reservei ' + (nums.length > 1 ? 'os números ' : 'o número ') + nums.map(pad).join(', ') +
    ' da rifa da ' + C.premio.toLowerCase() + '.\nNome: ' + nome.trim() +
    '\nTotal: ' + brl(nums.length * C.preco) + '\nSegue o comprovante do Pix.';
}

async function reservar() {
  erro = '';
  const nums = [...sel].sort((a, b) => a - b);
  if (!nome.trim()) { erro = 'Informe seu nome.'; return render(); }
  if (fone.replace(/\D/g, '').length < 10) { erro = 'Informe seu WhatsApp com DDD.'; return render(); }
  enviando = true; render();
  const { error } = await sb.rpc('rifa_reservar', { p_numeros: nums, p_nome: nome.trim(), p_telefone: fone.trim() });
  enviando = false;
  if (error) { erro = erroMsg(error); await carregar(); return; }
  reservado = nums; reservadoEm = new Date(); sel.clear();
  await carregar();
  document.getElementById('painel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- BLOCOS ----------
function blocoSorteio(livres) {
  if (C.resultado_numero != null) return null;
  const alvo = dataHoraSorteio(C.data_sorteio);
  if (alvo && alvo > Date.now()) {
    return [
      h('p', { class: 'sub' }, 'Sorteio pela Loteria Federal · ' + fmtData(C.data_sorteio) + ', 19h'),
      h('div', { class: 'cd', id: 'cd', 'aria-live': 'off' })
    ];
  }
  return h('p', { class: 'aviso-lf' },
    'Sorteio pela Loteria Federal, na primeira extração depois que os ' + C.total + ' números forem vendidos. ' +
    (livres > 0 ? 'Faltam ' + livres + ' números.' : 'Todos vendidos! A data será anunciada aqui.'));
}

function atualizarContagem() {
  const el = document.getElementById('cd');
  if (!el || !C) return;
  const c = contagem(dataHoraSorteio(C.data_sorteio));
  if (!c) { el.replaceChildren(h('div', null, h('b', null, 'Hoje'), h('span', null, '19h'))); return; }
  el.replaceChildren(...[['d', 'dias'], ['h', 'horas'], ['m', 'min'], ['s', 'seg']]
    .map(([k, l]) => h('div', null, h('b', null, String(c[k]).padStart(2, '0')), h('span', null, l))));
}

function blocoCompraRapida(fechado) {
  if (fechado) return null;
  return h('section', { class: 'panel' },
    h('h2', null, 'Compra rápida'),
    h('p', { class: 'muted' }, 'O site escolhe números livres aleatórios para você.'),
    h('div', { class: 'quick' }, [5, 10, 20].map(q =>
      h('button', { onclick: () => compraRapida(q) }, h('b', null, '+' + q), h('span', null, brl(q * C.preco))))));
}

function blocoRanking() {
  if (!ranking.length) return null;
  const medalhas = ['#d4a72c', '#a7adb4', '#b8733d'];
  return h('section', { class: 'panel' },
    h('h2', null, 'Maiores compradores'),
    h('p', { class: 'premio-rank' }, 'Quem mais comprar ganha ', h('strong', null, 'R$ 50 no Pix'), '!'),
    h('ol', { class: 'rank' }, ranking.map((p, i) =>
      h('li', null,
        h('span', { class: 'rank-pos', style: i < 3 ? 'background:' + medalhas[i] + ';color:#17191d' : '' }, i + 1),
        h('span', { class: 'rank-ini', 'aria-hidden': 'true' }, (p.nome || '?')[0]),
        h('span', { class: 'rank-nome' }, p.nome),
        h('span', { class: 'rank-qtd' }, p.qtd + (p.qtd > 1 ? ' números' : ' número'))))),
    h('p', { class: 'muted' }, 'Conta só números pagos. Veja as regras no regulamento.'));
}

function blocoCompartilhar() {
  const texto = 'Rifa: ' + C.premio.toLowerCase() + ' ou R$ 2.000 no Pix, por ' + brl(C.preco) + ' o número! Sorteio pela Loteria Federal. Escolha os seus: ' + SITE;
  return h('section', { class: 'panel' },
    h('h2', null, 'Compartilhe com os amigos'),
    h('div', { class: 'row' },
      h('a', { class: 'btn primary', href: 'https://wa.me/?text=' + encodeURIComponent(texto), target: '_blank', rel: 'noopener' }, 'Mandar no WhatsApp'),
      h('button', { class: 'btn', onclick: e => copiar(SITE, e.currentTarget) }, 'Copiar link')));
}

function blocoRegulamento() {
  const prazo = C.prazo_horas || 24;
  return h('details', { class: 'regras', id: 'regulamento', open: regrasAbertas, ontoggle: e => (regrasAbertas = e.target.open) },
    h('summary', null, 'Regulamento'),
    h('div', null,
      h('h3', null, 'Prêmio'),
      h('p', null, 'O ganhador escolhe entre:'),
      h('ul', null,
        h('li', null, 'uma ' + C.premio.toLowerCase() + ' conforme as fotos desta página' + (C.descricao ? ' (' + C.descricao + ')' : '') + '; ou'),
        h('li', null, 'R$ 2.000,00 (dois mil reais) em dinheiro, pagos via Pix na conta do ganhador.')),
      h('p', null, 'A escolha é informada ao organizador pelo WhatsApp em até 7 dias depois do resultado.'),
      h('h3', null, 'Quem pode participar'),
      h('p', null, 'Maiores de 18 anos. Ao reservar e pagar, o participante concorda com este regulamento.'),
      h('h3', null, 'Números e valor'),
      h('p', null, 'São ' + C.total + ' números, de ' + pad(PRIMEIRO) + ' a ' + pad(ultimo(C.total)) + ', a ' + brl(C.preco) + ' cada. Cada número pertence a uma única pessoa.'),
      h('h3', null, 'Como participar'),
      h('ol', null,
        h('li', null, 'Escolha seus números na grade, pela busca ou pela compra rápida (até ' + MAX_POR_RESERVA + ' por reserva).'),
        h('li', null, 'Informe nome e WhatsApp e reserve.'),
        h('li', null, 'Pague pelo Pix em até ' + prazo + ' horas e envie o comprovante no WhatsApp do organizador.'),
        h('li', null, 'Reservas não pagas dentro do prazo são canceladas automaticamente e os números voltam a ficar livres.')),
      h('h3', null, 'Sorteio'),
      h('p', null, 'O sorteio acontece pela Loteria Federal, na primeira extração depois que todos os ' + C.total + ' números forem vendidos. A data é anunciada nesta página e no grupo de WhatsApp.'),
      h('p', null, 'Ganha o número igual aos 3 últimos dígitos do 1º prêmio. Exemplo: se o 1º prêmio for 54.327, ganha o número 327.'),
      h('p', null, 'O resultado pode ser conferido por qualquer pessoa no site da Caixa (loterias.caixa.gov.br).'),
      h('h3', null, 'Prêmio para o maior comprador'),
      h('p', null, 'Quem tiver mais números pagos quando a rifa fechar ganha R$ 50,00 via Pix, além de concorrer normalmente ao prêmio principal. Os números são somados pelo WhatsApp informado na reserva. Em caso de empate, os R$ 50,00 são divididos igualmente entre os empatados.'),
      h('h3', null, 'Entrega'),
      h('p', null, 'O organizador entra em contato com o ganhador pelo WhatsApp informado na reserva.'),
      h('ul', null,
        h('li', null, 'Se o ganhador escolher a mesa, a retirada e o transporte são por conta do ganhador, no local e horário combinados com o organizador.'),
        h('li', null, 'Se escolher o dinheiro, os R$ 2.000,00 são pagos via Pix na conta do ganhador.')),
      h('h3', null, 'Uso de imagem'),
      h('p', null, 'O ganhador concorda em aparecer em foto ou vídeo recebendo o prêmio, para mostrar a todos os participantes que o sorteio foi feito.')));
}

function painel() {
  if (C.resultado_numero != null) return null;

  if (reservado) {
    const prazo = C.prazo_horas || 24;
    const limite = new Date(reservadoEm.getTime() + prazo * 3600 * 1000);
    const link = waLink(C.whatsapp, mensagem(reservado));
    const total = reservado.length * C.preco;
    const copiaCola = C.pix ? pixPayload({ chave: C.pix, valor: total, txid: 'RIFA' + pad(reservado[0]) + reservado.length }) : null;
    const qrImg = copiaCola ? qrSvg(copiaCola) : null;
    return h('section', { class: 'panel', id: 'painel' },
      h('h2', null, 'Números reservados!'),
      h('div', { class: 'chips' }, reservado.map(n => h('span', { class: 'chip' }, pad(n)))),
      h('p', { style: 'margin:0;font-weight:700;font-size:18px' }, 'Total: ' + brl(reservado.length * C.preco)),
      h('p', { class: 'prazo' }, 'Pague até ' + limite.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) +
        ' (' + prazo + ' horas). Depois disso a reserva é cancelada e os números voltam a ficar livres.'),
      qrImg ? h('div', { class: 'qr' },
        h('p', { class: 'muted', style: 'font-weight:700' }, 'Pague com o QR Code (já vem com o valor de ' + brl(total) + ')'), qrImg,
        h('button', { class: 'btn primary', onclick: e => copiar(copiaCola, e.currentTarget) }, 'Copiar Pix copia e cola')) : null,
      C.pix ? h('div', { style: 'display:grid;gap:6px' },
        h('p', { class: 'muted', style: 'font-weight:700' }, 'Ou pague pela chave Pix (e-mail)'),
        h('div', { class: 'row' }, h('span', { class: 'pix' }, C.pix),
          h('button', { class: 'btn sm', onclick: e => copiar(C.pix, e.currentTarget) }, 'Copiar chave'))) : null,
      h('div', { class: 'row' },
        link ? h('a', { class: 'btn primary', href: link, target: '_blank', rel: 'noopener' }, 'Enviar comprovante no WhatsApp') : null,
        h('button', { class: 'btn', onclick: () => { reservado = null; render(); } }, 'Escolher mais números'))
    );
  }

  if (!sel.size) return h('section', { class: 'panel', id: 'painel' },
    h('h2', null, 'Como participar'),
    h('p', { class: 'muted' }, '1. Escolha seus números na grade, pela busca ou na compra rápida.  2. Informe nome e WhatsApp e reserve.  3. Pague pelo Pix em até ' + (C.prazo_horas || 24) + ' horas e envie o comprovante.'));

  const nums = [...sel].sort((a, b) => a - b);
  return h('section', { class: 'panel', id: 'painel' },
    h('h2', null, 'Sua escolha'),
    h('div', { class: 'chips' }, nums.map(n => h('button', { class: 'chip', style: 'border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13px', title: 'Remover', onclick: () => { sel.delete(n); render(); } }, pad(n) + ' ×'))),
    h('p', { style: 'margin:0;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums' },
      nums.length + (nums.length > 1 ? ' números · ' : ' número · ') + brl(nums.length * C.preco)),
    h('div', { class: 'two' },
      h('label', null, 'Seu nome', h('input', { id: 'nome', value: nome, autocomplete: 'name', placeholder: 'Nome e sobrenome', maxlength: 80, oninput: e => (nome = e.target.value) })),
      h('label', null, 'Seu WhatsApp', h('input', { id: 'fone', value: fone, type: 'tel', autocomplete: 'tel', placeholder: '(19) 99999-9999', maxlength: 20, oninput: e => (fone = e.target.value) }))),
    erro ? h('p', { class: 'erro' }, erro) : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', disabled: enviando, onclick: reservar }, enviando ? 'Reservando…' : 'Reservar números'),
      h('button', { class: 'btn', onclick: () => { sel.clear(); erro = ''; render(); } }, 'Limpar')),
    h('p', { class: 'muted' }, 'Máximo de ' + MAX_POR_RESERVA + ' números por reserva.'));
}

function render() {
  const pagos = [...ocupados.values()].filter(s => s === 'pago').length;
  const res = ocupados.size - pagos;
  const livres = C.total - ocupados.size;
  const pct = Math.round((ocupados.size / C.total) * 100);
  const fechado = C.resultado_numero != null;

  const ini = PRIMEIRO + faixa * POR_FAIXA, fim = Math.min(ini + POR_FAIXA - 1, ultimo(C.total));
  const bolas = [];
  for (let n = ini; n <= fim; n++) {
    const st = status(n), taken = st !== 'livre';
    const b = bola(n, st, (taken ? 'taken' : '') + (sel.has(n) ? ' sel' : ''), () => {
      if (taken || fechado) return;
      escolher(n); reservado = null; erro = ''; render();
    });
    if (taken || fechado) b.disabled = true;
    b.setAttribute('aria-pressed', sel.has(n) ? 'true' : 'false');
    bolas.push(b);
  }

  let vencedor = null;
  if (fechado) {
    const b = bola(C.resultado_numero, '', '', null); b.disabled = true;
    vencedor = h('div', { class: 'winner' }, b,
      h('div', null, h('p', { class: 'muted' }, 'Número sorteado'),
        h('strong', null, 'Nº ' + pad(C.resultado_numero)),
        C.loteria_concurso || C.loteria_premio ? h('p', { class: 'muted' },
          'Loteria Federal' + (C.loteria_concurso ? ', concurso ' + C.loteria_concurso : '') + (C.loteria_premio ? ' · 1º prêmio ' + C.loteria_premio : '')) : null));
  }

  const ativo = document.activeElement?.id;
  app.replaceChildren(
    h('header', { class: 'felt' }, h('div', { class: 'wrap' },
      h('span', { class: 'eyebrow' }, 'Rifa · ' + C.total + ' números · ' + brl(C.preco) + ' cada'),
      h('h1', null, C.premio),
      h('p', { class: 'ou-dinheiro' }, 'ou ', h('strong', null, 'R$ 2.000 no Pix'), ' · o ganhador escolhe'),
      blocoSorteio(livres),
      h('div', { class: 'progress' },
        h('div', { class: 'bar', role: 'progressbar', 'aria-label': 'Números vendidos', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100 }, h('i', { style: 'width:' + pct + '%' })),
        h('div', { class: 'prow' }, h('span', null, pct + '% vendido · ' + pagos + ' pagos · ' + res + ' reservados'), h('span', null, livres + ' livres'))))),
    h('main', null, h('div', { class: 'wrap' },
      vencedor,
      h('figure', { class: 'foto' },
        h('img', { src: 'mesa.jpg', alt: 'Mesa de sinuca preta com tecido preto, tabelas vermelhas e cantoneiras de metal', width: 1200, height: 900 }),
        C.descricao ? h('figcaption', null, C.descricao) : null),
      blocoCompraRapida(fechado),
      fechado ? null : h('div', { class: 'tools' },
        h('label', null, 'Buscar número', h('input', { id: 'busca', type: 'number', inputmode: 'numeric', min: PRIMEIRO, max: ultimo(C.total), value: busca, placeholder: 'Ex.: 777',
          oninput: e => (busca = e.target.value), onkeydown: e => { if (e.key === 'Enter') irPara(); } })),
        h('button', { class: 'btn', onclick: irPara }, 'Escolher')),
      dica ? h('p', { class: 'erro' }, dica) : null,
      barraFaixas(C.total, faixa, ocupados, i => { faixa = i; dica = ''; render(); }),
      h('div', { class: 'legend' },
        h('span', null, h('i', { class: 'dot', style: 'background:var(--muted)' }), 'Livre'),
        h('span', null, h('i', { class: 'dot', style: 'background:var(--warn)' }), 'Reservado'),
        h('span', null, h('i', { class: 'dot', style: 'background:var(--ok)' }), 'Pago')),
      h('div', { class: 'grid' }, bolas),
      painel(),
      blocoRanking(),
      blocoCompartilhar(),
      blocoRegulamento())),
    h('footer', null, h('div', { class: 'wrap' }, 'Rifa entre amigos · a página atualiza sozinha a cada 30 segundos'))
  );
  atualizarContagem();
  { const t = document.querySelector('.tab.on'); if (t) t.parentElement.scrollLeft = t.offsetLeft - t.parentElement.offsetLeft - 40; }
  if (ativo === 'busca') document.getElementById('busca')?.focus();
}

carregar();
setInterval(atualizarContagem, 1000);
setInterval(() => {
  const ativo = document.activeElement && ['nome', 'fone', 'busca'].includes(document.activeElement.id);
  if (!ativo && !enviando) carregar();
}, 30000);
</script>
</body>
</html>
